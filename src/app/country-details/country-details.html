<!-- Loading -->
<div *ngIf="loading" class="loading">
  <p>Loading country details...</p>
</div>

<!-- Error -->
<div *ngIf="!loading && errorMessage" class="error">
  <p>{{ errorMessage }}</p>
</div>

<!-- Country Details -->
<div *ngIf="!loading && country" class="country-details-shell">
  <h2>{{ country.name?.common }}</h2>

  <div class="country-details-top">
    <img [src]="country.flags?.png" alt="Flag of {{ country.name?.common }}">

    <div class="country-details-info">
      <p><strong>Region:</strong> {{ country.region || 'N/A' }}</p>
      <p><strong>Capital:</strong> {{ country.capital?.[0] || 'N/A' }}</p>
      <p><strong>Population:</strong> {{ country.population | number }}</p>
      <p><strong>Currencies:</strong>
        <span *ngFor="let c of country.currencies | keyvalue; let last = last">
          {{ c.value.name }} ({{ c.value.symbol }})<span *ngIf="!last">, </span>
        </span>
      </p>
    </div>
  </div>

  <div class="btn-group">
    <button (click)="toggleWeather()">{{ showWeather ? 'Hide Weather' : 'View Weather' }}</button>
    <button routerLink="/">⬅ Back</button>
  </div>

  <div *ngIf="showWeather" style="margin-top:18px;">
    <app-weather-details [capital]="country.capital[0]"></app-weather-details>
  </div>
</div>
